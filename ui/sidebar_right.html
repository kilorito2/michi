<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root{
    --glass-bg: rgba(255,255,255,0.09);
    --glass-bg-strong: rgba(255,255,255,0.17);
    --glass-border: rgba(255,255,255,0.20);
    --text: #f3f4fb;
    --text-dim: rgba(243,244,251,0.55);
    --accent: #8b7bff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  /* El WebView de este panel mide siempre PANEL_W (300px) y se desliza por
     encima de la pagina: cerrado queda casi entero fuera de la ventana y
     solo asoma su franja de 10px del lado de adentro, con el "grip" (ver
     src/layout.rs y src/panels.rs). El cajon de vidrio ocupa todo el WebView. */
  .surface {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(26,24,42,0.62), rgba(16,15,28,0.58));
    border-left: 1px solid var(--glass-border);
  }

  .grip-zone {
    position: absolute; top: 0; bottom: 0; left: 0; width: 10px;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .16s ease;
  }
  .grip { width: 4px; height: 64px; border-radius: 4px; background: rgba(255,255,255,0.28); }
  .surface.expanded .grip-zone { opacity: 0; }

  /* El contenido se funde mientras el cajon entra/sale. */
  .panel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 10px 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s ease;
  }
  .surface.expanded .panel {
    opacity: 1;
    pointer-events: auto;
    transition: opacity .24s ease .05s;
  }

  @media (prefers-reduced-motion: reduce) {
    .panel, .surface.expanded .panel { transition: none; }
  }

  .head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; }
  .head h1 { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); margin: 0; }
  .add-btn {
    width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text); cursor: pointer; font-size: 16px;
    transition: background .15s ease, transform .15s ease;
  }
  /* Icono dibujado y no el caracter "+": el glifo de la fuente queda corrido
     segun sus metricas (se veia fuera del centro del boton). */
  .add-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .add-btn:hover { background: var(--glass-bg-strong); }
  .add-btn:active { transform: scale(.92); }

  .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  .tab-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 8px;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid transparent;
    position: relative;
    transition: background .15s ease, border-color .15s ease;
  }
  .tab-row:hover { background: var(--glass-bg); }
  .tab-row.active { background: var(--glass-bg-strong); border-color: var(--accent); }
  /* Ranura fija de 16px para el icono, sea el favicon del sitio o el punto. */
  .tab-ico { width: 16px; height: 16px; flex: none; display: flex; align-items: center; justify-content: center; }
  .tab-ico img { width: 16px; height: 16px; border-radius: 4px; object-fit: contain; }
  .tab-ico .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .tab-row.active .tab-ico .dot { background: #7cf29c; }
  /* Pestana de incognito: borde violeta y un fantasma en vez del punto. */
  .tab-row.incognito { background: rgba(176,140,255,0.10); }
  .tab-row.incognito:hover { background: rgba(176,140,255,0.18); }
  .tab-row.incognito.active { background: rgba(176,140,255,0.22); border-color: #b08cff; }
  .tab-ghost { flex: none; width: 15px; height: 15px; color: #c9b3ff; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tab-ico .tab-ghost { width: 16px; height: 16px; }
  .tab-row.incognito .tab-title { color: #ece3ff; }
  .tab-title { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-close {
    flex: none; width: 18px; height: 18px; border-radius: 6px;
    display: none; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 12px;
  }
  .tab-row:hover .tab-close { display: flex; }
  .tab-close:hover { background: var(--danger); color: white; }

  /* Altavoz: la pestana suena (o esta silenciada). Un clic la silencia. */
  .tab-audio {
    flex: none; width: 20px; height: 20px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; color: var(--text-dim);
  }
  .tab-audio:hover { background: var(--glass-bg-strong); color: var(--text); }
  .tab-audio svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tab-audio.muted { color: #ffb4b4; }
  .tab-row.crashed .tab-title { color: var(--text-dim); font-style: italic; }

  /* Fijadas: solo el icono, en una grilla arriba de la lista. */
  .pinned { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; padding: 0 0 10px; }
  .pinned:empty { display: none; }
  .tile {
    position: relative; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--glass-bg); border: 1px solid transparent; cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .tile:hover { background: var(--glass-bg-strong); }
  .tile.active { background: var(--glass-bg-strong); border-color: var(--accent); }
  .tile.incognito { background: rgba(176,140,255,0.14); }
  .tile.incognito.active { border-color: #b08cff; }
  .tile .badge {
    position: absolute; right: 3px; bottom: 3px; width: 14px; height: 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; background: rgba(16,15,28,0.9); color: var(--text);
  }
  .tile .badge svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .tile .badge.muted { color: #ffb4b4; }

  /* Arrastrando para reordenar. */
  .tab-row, .tile { touch-action: none; }
  .dragging { opacity: .92; background: var(--glass-bg-strong) !important; box-shadow: 0 6px 18px rgba(0,0,0,.35); z-index: 2; }

  /* Menu del clic derecho sobre una pestana. */
  .ctx {
    position: absolute; z-index: 10; min-width: 190px; padding: 5px;
    background: rgba(24,22,38,0.97); border: 1px solid var(--glass-border); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .ctx[hidden] { display: none; }
  .ctx-item { font-size: 12.5px; color: var(--text); padding: 7px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  .ctx-item:hover { background: var(--glass-bg-strong); }
  .ctx-item.danger:hover { background: rgba(255,107,107,0.25); }
  .ctx-sep { height: 1px; margin: 4px 6px; background: var(--glass-border); }

  /* Grupos: un encabezado con su color y las pestanas con una franja al costado. */
  .group-head {
    display: flex; align-items: center; gap: 7px; padding: 6px 8px; margin-top: 4px;
    border-radius: 10px; cursor: pointer; color: var(--text);
  }
  .group-head:hover { background: var(--glass-bg); }
  .g-chev { flex: none; width: 12px; height: 12px; fill: none; stroke: var(--text-dim); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transform: rotate(90deg); transition: transform .15s ease; }
  .group-head.collapsed .g-chev { transform: none; }
  .g-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--g); }
  .g-name { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--g); }
  .g-name.unnamed { color: var(--text-dim); font-weight: 500; }
  .g-count { flex: none; font-size: 10.5px; color: var(--text-dim); padding: 1px 7px; border-radius: 9px; background: var(--glass-bg); }
  .group-head.collapsed { background: color-mix(in srgb, var(--g) 14%, transparent); }
  .g-input {
    flex: 1; min-width: 0; height: 24px; padding: 0 8px; border-radius: 7px; outline: none;
    font: inherit; font-size: 12px; color: var(--text); background: rgba(255,255,255,0.1); border: 1px solid var(--g);
    user-select: text;
  }
  .tab-row.in-group { margin-left: 8px; }
  .tab-row.in-group::before {
    content: ""; position: absolute; left: -6px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--g);
  }
  .ctx-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 0; }
  .ctx-swatches { display: flex; flex-wrap: wrap; gap: 7px; padding: 6px 10px 8px; }
  .swatch { width: 16px; height: 16px; border-radius: 50%; cursor: pointer; box-shadow: 0 0 0 2px transparent; transition: transform .1s ease; }
  .swatch:hover { transform: scale(1.15); }
  .swatch.on { box-shadow: 0 0 0 2px rgba(24,22,38,0.97), 0 0 0 4px #fff; }
</style>
</head>
<body>
  <div class="surface" id="surface">
    <div class="grip-zone"><div class="grip"></div></div>
    <div class="panel">
      <div class="head">
        <h1>Pestañas</h1>
        <div class="add-btn" id="add" title="Nueva pestaña (Ctrl+T)">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
      <div class="pinned" id="pinned"></div>
      <div class="list" id="list"></div>
    </div>
    <div class="ctx" id="ctx" role="menu" hidden></div>
  </div>

<script src="/wallpaper.js" data-variant="blur"></script>
<script>
(function () {
  // Envuelto en IIFE: el motor puede volver a ejecutar este script sobre el
  // mismo documento, y sin esto las declaraciones de nivel superior chocarian.
  function ipc(cmd, extra) {
    window.ipc.postMessage(JSON.stringify(Object.assign({ cmd }, extra || {})));
  }

  document.getElementById('add').addEventListener('click', () => ipc('new_tab'));

  // Solo avisamos cuando el cursor ENTRA: cerrar el panel lo decide Rust
  // mirando la posicion real del cursor (ver src/panels.rs). mouseleave no
  // es fiable en un WebView2 que cambia de tamano debajo del cursor, y
  // perder uno solo (moviendo el mouse rapido) dejaba el panel abierto.
  // `expanded` es nuestra copia del estado real, que Rust nos confirma con
  // window.onExpanded; sirve para no mandar un IPC por cada mousemove.
  let expanded = false;
  const surface = document.getElementById('surface');

  function markInside() {
    if (expanded) return;
    expanded = true;
    surface.classList.add('expanded');
    ipc('expand_right', { value: true });
  }
  document.addEventListener('mouseenter', markInside);
  document.addEventListener('mousemove', markInside);

  window.onExpanded = function (value) {
    expanded = value;
    surface.classList.toggle('expanded', value);
  };

  const GHOST = '<svg class="tab-ghost" viewBox="0 0 24 24"><path d="M5 21V11a7 7 0 0 1 14 0v10l-2.4-2-2.3 2-2.3-2-2.3 2L7.4 19z"/><circle cx="9.6" cy="11" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.4" cy="11" r="1.1" fill="currentColor" stroke="none"/></svg>';
  const SPEAKER = '<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11"/></svg>';
  const MUTED = '<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>';

  const list = document.getElementById('list');
  const pinnedEl = document.getElementById('pinned');
  const ctx = document.getElementById('ctx');
  const CHEV = '<svg class="g-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';

  // Lo ultimo que mando Rust. Con el boton apretado sobre una pestana (o
  // escribiendo el nombre de un grupo) no se redibuja: se guarda y se pinta
  // despues.
  let tabs = [];
  let groups = [];
  let colors = [];
  let pendingTabs = null;
  let drag = null;
  let renaming = null;

  function titleOf(t) {
    return t.title && t.title.length ? t.title : (t.incognito ? 'Nueva pestaña de incógnito' : 'Nueva pestaña');
  }
  function groupOf(id) { return groups.find((g) => g.id === id); }
  function groupLabel(g) { return g.name || 'Grupo sin nombre'; }

  function icon(t) {
    const ico = document.createElement('div');
    ico.className = 'tab-ico';
    function showDot() {
      ico.innerHTML = '';
      if (t.incognito) { ico.innerHTML = GHOST; return; }
      const dot = document.createElement('span');
      dot.className = 'dot';
      ico.appendChild(dot);
    }
    if (t.favicon) {
      const img = document.createElement('img');
      img.alt = '';
      // Si el data URL no es una imagen valida, cae al punto.
      img.addEventListener('error', showDot);
      img.src = t.favicon;
      ico.appendChild(img);
    } else {
      showDot();
    }
    return ico;
  }

  function audioButton(t, cls) {
    const b = document.createElement('div');
    b.className = cls + (t.muted ? ' muted' : '');
    b.title = t.muted ? 'Activar el sonido' : 'Silenciar la pestaña';
    b.innerHTML = t.muted ? MUTED : SPEAKER;
    b.addEventListener('click', (e) => { e.stopPropagation(); ipc('mute_tab', { id: t.id, muted: !t.muted }); });
    return b;
  }

  function render(data) {
    tabs = data.tabs;
    groups = data.groups || [];
    colors = data.colors || colors;
    list.innerHTML = '';
    pinnedEl.innerHTML = '';
    let current = null;
    tabs.forEach((t) => {
      if (t.pinned) {
        const el = tile(t);
        el.dataset.id = t.id;
        wire(el, t);
        pinnedEl.appendChild(el);
        return;
      }
      const g = t.group != null ? groupOf(t.group) : null;
      if (g && current !== g.id) {
        current = g.id;
        list.appendChild(groupHead(g, t.id));
      } else if (!g) {
        current = null;
      }
      if (g && g.collapsed) return;
      const el = row(t, g);
      el.dataset.id = t.id;
      wire(el, t);
      list.appendChild(el);
    });
  }

  function groupHead(g, firstId) {
    const h = document.createElement('div');
    h.className = 'group-head' + (g.collapsed ? ' collapsed' : '');
    h.dataset.group = g.id;
    h.dataset.first = firstId;
    h.style.setProperty('--g', g.hex);
    const count = tabs.filter((t) => t.group === g.id).length;
    h.innerHTML = CHEV + '<span class="g-dot"></span>';
    const name = document.createElement('span');
    name.className = 'g-name' + (g.name ? '' : ' unnamed');
    name.textContent = groupLabel(g);
    h.appendChild(name);
    const c = document.createElement('span');
    c.className = 'g-count';
    c.textContent = count;
    h.appendChild(c);
    h.title = g.collapsed ? 'Desplegar el grupo' : 'Plegar el grupo';
    h.addEventListener('click', () => { if (!renaming) ipc('update_group', { group: g.id, collapsed: !g.collapsed }); });
    h.addEventListener('contextmenu', (e) => { e.preventDefault(); openGroupMenu(g, e.clientX, e.clientY); });
    return h;
  }

  function row(t, g) {
    const r = document.createElement('div');
    r.className = 'tab-row' + (t.active ? ' active' : '') + (t.incognito ? ' incognito' : '') + (t.crashed ? ' crashed' : '') + (g ? ' in-group' : '');
    if (g) r.style.setProperty('--g', g.hex);
    r.title = t.incognito ? 'Pestaña de incógnito' : '';
    r.appendChild(icon(t));
    const title = document.createElement('div');
    title.className = 'tab-title';
    title.textContent = titleOf(t);
    r.appendChild(title);
    // Con el favicon del sitio en el icono, el fantasma va aca: asi una de
    // incognito se distingue siempre.
    if (t.incognito && t.favicon) {
      const badge = document.createElement('span');
      badge.style.display = 'flex';
      badge.innerHTML = GHOST;
      r.appendChild(badge);
    }
    if (t.audible || t.muted) r.appendChild(audioButton(t, 'tab-audio'));
    const close = document.createElement('div');
    close.className = 'tab-close';
    close.title = 'Cerrar (Ctrl+W)';
    close.textContent = '✕';
    close.addEventListener('click', (e) => { e.stopPropagation(); ipc('close_tab', { id: t.id }); });
    r.appendChild(close);
    return r;
  }

  function tile(t) {
    const el = document.createElement('div');
    el.className = 'tile' + (t.active ? ' active' : '') + (t.incognito ? ' incognito' : '');
    el.title = titleOf(t);
    el.appendChild(icon(t));
    if (t.audible || t.muted) el.appendChild(audioButton(t, 'badge'));
    return el;
  }

  // Clic: ir a la pestana. Clic con la rueda: cerrarla. Arrastrar: moverla
  // (las fijadas entre fijadas, las demas en la lista; soltarla entre dos
  // pestanas de un grupo la mete en el grupo).
  function wire(el, t) {
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('.tab-close, .tab-audio, .badge')) return;
      closeMenu();
      drag = { id: t.id, el, x: e.clientX, y: e.clientY, moved: false, box: t.pinned ? pinnedEl : list };
    });
    el.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
    el.addEventListener('auxclick', (e) => {
      if (e.button === 1) { e.preventDefault(); ipc('close_tab', { id: t.id }); }
    });
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); openMenu(t, e.clientX, e.clientY); });
  }

  // Mueve el elemento arrastrado entre sus hermanos segun el puntero (en la
  // lista, por la mitad de cada fila; en la grilla de fijadas, en orden de
  // lectura).
  function place(d, x, y) {
    const grid = d.box === pinnedEl;
    let before = null;
    for (const c of d.box.children) {
      if (c === d.el) continue;
      const r = c.getBoundingClientRect();
      const after = grid ? (y > r.bottom || (y >= r.top && x > r.left + r.width / 2)) : y > r.top + r.height / 2;
      if (!after) { before = c; break; }
    }
    if (before !== d.el.nextSibling && before !== d.el) d.box.insertBefore(d.el, before);
  }

  // El movimiento y el soltar se escuchan en todo el documento y no en la
  // fila: al moverla de lugar en la lista, el navegador le suelta la captura
  // del puntero, y el aviso de soltar podia perderse (quedaba arrastrando).
  document.addEventListener('pointermove', (e) => {
    if (!drag) return;
    // Se solto fuera del panel (o se perdio el aviso): termina ahi.
    if (!(e.buttons & 1)) { finishDrag(false); return; }
    if (!drag.moved) {
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 6) return;
      drag.moved = true;
      drag.el.classList.add('dragging');
    }
    place(drag, e.clientX, e.clientY);
  });
  document.addEventListener('pointerup', () => finishDrag(false));
  document.addEventListener('pointercancel', () => finishDrag(true));
  window.addEventListener('blur', () => finishDrag(true));

  function finishDrag(cancelled) {
    if (!drag) return;
    const d = drag;
    const el = d.el;
    drag = null;
    el.classList.remove('dragging');
    if (!d.moved) {
      if (!cancelled) ipc('switch_tab', { id: d.id });
    } else if (!cancelled) {
      // Se le dice a Rust ANTES de que pestana quedo (la de la fila que
      // sigue, o la primera del grupo si lo que sigue es su encabezado): las
      // de un grupo plegado no estan en la lista, asi que una posicion no
      // alcanzaria.
      const next = el.nextElementSibling;
      const before = !next ? null : next.dataset.first ? +next.dataset.first : +next.dataset.id;
      // Justo debajo del encabezado de un grupo abierto: entra a ese grupo.
      const prev = el.previousElementSibling;
      const group = prev && prev.dataset.group && !prev.classList.contains('collapsed') ? +prev.dataset.group : null;
      ipc('move_tab', { id: d.id, before: before, group: group });
    }
    flush();
  }

  function flush() {
    if (pendingTabs && !drag && !renaming) { const p = pendingTabs; pendingTabs = null; render(p); }
  }

  // --- Nombre de un grupo, en el lugar ---
  function startRename(groupId) {
    const head = list.querySelector('.group-head[data-group="' + groupId + '"]');
    const g = groupOf(groupId);
    if (!head || !g) return;
    renaming = groupId;
    const name = head.querySelector('.g-name');
    const input = document.createElement('input');
    input.className = 'g-input';
    input.value = g.name;
    input.placeholder = 'Nombre del grupo';
    input.maxLength = 40;
    input.spellcheck = false;
    name.replaceWith(input);
    ipc('editing_right', { value: true });
    let done = false;
    function finish(save) {
      if (done) return;
      done = true;
      renaming = null;
      ipc('editing_right', { value: false });
      if (save) ipc('update_group', { group: groupId, name: input.value });
      else if (pendingTabs == null) pendingTabs = { tabs, groups, colors };
      flush();
    }
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
    input.addEventListener('click', (e) => e.stopPropagation());
    input.focus();
    input.select();
  }
  window.onGroupCreated = function (id) { startRename(id); };

  // --- Menus del clic derecho ---
  function showMenu(items, x, y) {
    ctx.innerHTML = '';
    items.forEach((item) => {
      if (!item) { const sep = document.createElement('div'); sep.className = 'ctx-sep'; ctx.appendChild(sep); return; }
      if (item.swatches) { ctx.appendChild(item.swatches); return; }
      const el = document.createElement('div');
      el.className = 'ctx-item' + (item[2] ? ' ' + item[2] : '');
      el.setAttribute('role', 'menuitem');
      if (item[3]) {
        const dot = document.createElement('span');
        dot.className = 'ctx-dot';
        dot.style.background = item[3];
        el.appendChild(dot);
      }
      el.appendChild(document.createTextNode(item[0]));
      el.addEventListener('click', () => { closeMenu(); item[1](); });
      ctx.appendChild(el);
    });
    ctx.hidden = false;
    const w = ctx.offsetWidth, h = ctx.offsetHeight;
    ctx.style.left = Math.max(6, Math.min(x, window.innerWidth - w - 6)) + 'px';
    ctx.style.top = Math.max(6, Math.min(y, window.innerHeight - h - 6)) + 'px';
  }

  function openMenu(t, x, y) {
    const others = tabs.some((o) => o.id !== t.id && !o.pinned);
    const items = [
      [t.pinned ? 'Desfijar pestaña' : 'Fijar pestaña', () => ipc('pin_tab', { id: t.id, pinned: !t.pinned })],
      [t.muted ? 'Activar el sonido' : 'Silenciar pestaña', () => ipc('mute_tab', { id: t.id, muted: !t.muted })],
      ['Volver a cargar', () => ipc('reload_tab', { id: t.id })],
      ['Duplicar', () => ipc('duplicate_tab', { id: t.id })],
    ];
    // Grupos (una fijada no puede estar en uno).
    if (!t.pinned) {
      items.push(null);
      items.push(['Agregar a un grupo nuevo', () => ipc('new_group', { id: t.id })]);
      groups.filter((g) => g.id !== t.group).forEach((g) => {
        items.push(['Agregar a «' + groupLabel(g) + '»', () => ipc('add_to_group', { id: t.id, group: g.id }), '', g.hex]);
      });
      if (t.group != null) items.push(['Quitar del grupo', () => ipc('remove_from_group', { id: t.id })]);
    }
    items.push(null);
    if (others) items.push(['Cerrar las demás', () => ipc('close_other_tabs', { id: t.id })]);
    items.push(['Cerrar', () => ipc('close_tab', { id: t.id }), 'danger']);
    showMenu(items, x, y);
  }

  function openGroupMenu(g, x, y) {
    const sw = document.createElement('div');
    sw.className = 'ctx-swatches';
    colors.forEach((c) => {
      const s = document.createElement('span');
      s.className = 'swatch' + (c.id === g.color ? ' on' : '');
      s.style.background = c.hex;
      s.title = c.id.charAt(0).toUpperCase() + c.id.slice(1);
      s.addEventListener('click', () => { closeMenu(); ipc('update_group', { group: g.id, color: c.id }); });
      sw.appendChild(s);
    });
    showMenu([
      ['Cambiar el nombre', () => startRename(g.id)],
      { swatches: sw },
      ['Nueva pestaña en el grupo', () => ipc('new_tab_in_group', { group: g.id })],
      [g.collapsed ? 'Desplegar' : 'Plegar', () => ipc('update_group', { group: g.id, collapsed: !g.collapsed })],
      null,
      ['Desagrupar', () => ipc('ungroup', { group: g.id })],
      ['Cerrar el grupo', () => ipc('close_group', { group: g.id }), 'danger'],
    ], x, y);
  }

  function closeMenu() { ctx.hidden = true; }
  document.addEventListener('pointerdown', (e) => { if (!ctx.hidden && !ctx.contains(e.target)) closeMenu(); }, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
  // Fuera de las pestanas, sin el menu de WebView2 (Atras, Inspeccionar...).
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  const onExpandedBase = window.onExpanded;
  window.onExpanded = function (value) {
    onExpandedBase(value);
    if (!value) closeMenu();
  };

  window.onTabs = function (data) {
    if (drag || renaming) { pendingTabs = data; return; }
    render(data);
  };

  ipc('ready');
})();
</script>
</body>
</html>
