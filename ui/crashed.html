<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>La página dejó de funcionar</title>
<style>
  :root{
    --card: rgba(20,18,34,0.82);
    --line: rgba(255,255,255,0.12);
    --line-strong: rgba(255,255,255,0.22);
    --text: #f3f4fb;
    --text-dim: rgba(243,244,251,0.62);
    --accent: #8b7bff;
  }
  * { box-sizing: border-box; }
  /* Fondo de respaldo en <html> y <body> transparente: ver el mismo
     comentario en newtab.html (el <video> de fondo va con z-index:-1). */
  html { background: #0b0a13; }
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
  }
  body { background: transparent; }
  #veil { position: fixed; inset: 0; z-index: 0; background: rgba(8,7,16,0.66); }

  .center { position: relative; z-index: 1; height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: min(520px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 30px 32px 26px; }
  .icon {
    width: 48px; height: 48px; border-radius: 14px; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(139,123,255,0.16); color: #b9adff;
  }
  .icon svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 21px; font-weight: 600; margin: 0 0 12px; letter-spacing: -.01em; }
  p { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); margin: 0 0 12px; }
  .host { color: var(--text); font-weight: 600; word-break: break-all; }

  .btns { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .btn {
    font: inherit; font-size: 13px; color: var(--text);
    height: 36px; padding: 0 16px; border-radius: 9px;
    border: 1px solid var(--line-strong); background: rgba(255,255,255,0.06);
    cursor: pointer; transition: background .15s ease, transform .1s ease;
  }
  .btn:hover { background: rgba(255,255,255,0.12); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #9a8cff; }
  .btn[hidden] { display: none; }
  .note { font-size: 12px; margin: 20px 0 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="veil"></div>
<div class="center">
  <div class="card" role="alert">
    <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 16.5c1-1.3 2.2-2 3.5-2s2.5.7 3.5 2"/><path d="M8.6 9.2l1.8 1.3M10.4 9.2l-1.8 1.3M13.6 9.2l1.8 1.3M15.4 9.2l-1.8 1.3"/></svg></div>
    <h1 id="head">Esta página dejó de funcionar</h1>
    <p id="desc">Algo hizo que la página se cerrara de golpe. El resto de Michi y tus otras pestañas siguen bien.</p>
    <div class="btns">
      <button class="btn primary" id="reload" hidden autofocus>Volver a cargar</button>
    </div>
    <p class="note" id="note">Si vuelve a pasar con el mismo sitio, puede ser un problema del sitio o de una extensión.</p>
  </div>
</div>

<script src="/wallpaper.js"></script>
<script>
(function () {
  function ipc(cmd, extra) {
    window.ipc.postMessage(JSON.stringify(Object.assign({ cmd }, extra || {})));
  }
  var reload = document.getElementById('reload');

  // Rust manda lo que se cayo en esta pestana (ver recovery::crash_info).
  window.onCrashed = function (d) {
    var host = document.createElement('span');
    host.className = 'host';
    host.textContent = d.host || d.title || d.url;
    var desc = document.getElementById('desc');
    desc.textContent = '';
    if (d.reason === 'memory') {
      document.getElementById('head').textContent = 'Esta página se quedó sin memoria';
      desc.append(host, ' uso más memoria de la que había disponible y se cerró. El resto de Michi sigue bien.');
      document.getElementById('note').textContent =
        'Cerrar otras pestanas o programas libera memoria. En Ajustes > Rendimiento, el modo Optimizado hace que las pestanas de atras usen menos.';
    } else {
      desc.append('Algo hizo que ', host, ' se cerrara de golpe. El resto de Michi y tus otras pestañas siguen bien.');
    }
    reload.hidden = false;
    reload.focus();
    document.title = (d.title || d.host || 'Pagina') + ' - Dejó de funcionar';
  };

  reload.addEventListener('click', function () { ipc('crashed_reload'); });

  ipc('ready');
})();
</script>
</body>
</html>
