<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root{
    --glass-bg: rgba(255,255,255,0.09);
    --glass-bg-strong: rgba(255,255,255,0.17);
    --glass-border: rgba(255,255,255,0.20);
    --text: #f3f4fb;
    --text-dim: rgba(243,244,251,0.55);
    --accent: #8b7bff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    color: var(--text);
  }
  /* Mismo vidrio que los paneles: el fondo animado (version difuminada, ver
     /wallpaper.js) queda debajo y este tinte encima. El WebView del menu es
     un rectangulo opaco, por eso sin esquinas redondeadas. */
  .menu {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 6px;
    background: linear-gradient(180deg, rgba(26,24,42,0.78), rgba(16,15,28,0.74));
    border: 1px solid var(--glass-border);
  }
  .item {
    display: flex; align-items: center; gap: 10px;
    height: 34px; padding: 0 10px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }
  .item:hover, .item:focus-visible { background: var(--glass-bg-strong); }
  .item[aria-disabled="true"] { opacity: .4; pointer-events: none; }
  .item svg { flex: none; width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .item .label { flex: 1; }
  .item .kbd { font-size: 11px; color: var(--text-dim); }
  .sep { height: 1px; margin: 4px 8px; background: var(--glass-border); flex: none; }

  .zoom { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 6px 0 10px; font-size: 13px; }
  .zoom .label { flex: 1; }
  .zoom-ctl { display: flex; align-items: center; border: 1px solid var(--glass-border); border-radius: 8px; overflow: hidden; }
  .zoom-ctl button {
    width: 32px; height: 28px; border: none; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; cursor: pointer;
  }
  .zoom-ctl button:hover { background: var(--glass-bg-strong); }
  .zoom-ctl .value {
    min-width: 54px; height: 28px; padding: 0 6px; border: none; border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border);
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .item.quit:hover { background: rgba(255,107,107,0.22); }
</style>
</head>
<body>
  <div class="menu" role="menu">
    <div class="item" role="menuitem" tabindex="0" data-action="new_tab">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">Nueva pestana</span><span class="kbd">Ctrl+T</span>
    </div>
    <div class="item" role="menuitem" tabindex="0" data-action="reopen_tab">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span class="label">Reabrir pestana cerrada</span><span class="kbd">Ctrl+Mayus+T</span>
    </div>
    <div class="sep"></div>

    <div class="zoom">
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;opacity:.85"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="label">Zoom</span>
      <div class="zoom-ctl">
        <button data-action="zoom_out" title="Alejar (Ctrl -)">&minus;</button>
        <button class="value" data-action="zoom_reset" title="Restablecer (Ctrl 0)" id="zoom">100%</button>
        <button data-action="zoom_in" title="Acercar (Ctrl +)">+</button>
      </div>
    </div>
    <div class="sep"></div>

    <div class="item" role="menuitem" tabindex="0" data-action="bookmark" id="bookmark">
      <svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>
      <span class="label" id="bookmark-label">Agregar a marcadores</span><span class="kbd">Ctrl+D</span>
    </div>
    <div class="item" role="menuitem" tabindex="0" data-action="library">
      <svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      <span class="label">Historial y descargas</span><span class="kbd">Ctrl+H</span>
    </div>
    <div class="sep"></div>

    <div class="item" role="menuitem" tabindex="0" data-action="print">
      <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>
      <span class="label">Imprimir...</span><span class="kbd">Ctrl+P</span>
    </div>
    <div class="item" role="menuitem" tabindex="0" data-action="devtools">
      <svg viewBox="0 0 24 24"><path d="m8 8-5 4 5 4M16 8l5 4-5 4M14 4l-4 16"/></svg>
      <span class="label">Herramientas de desarrollador</span><span class="kbd">F12</span>
    </div>
    <div class="sep"></div>

    <div class="item" role="menuitem" tabindex="0" data-action="extensions">
      <svg viewBox="0 0 24 24"><path d="M19.44 7.85c-.05.32.06.65.29.88l1.57 1.57a2.4 2.4 0 0 1 0 3.4l-1.61 1.61a.98.98 0 0 1-.84.28c-.47-.07-.8-.48-.97-.93a2.5 2.5 0 1 0-3.21 3.21c.45.17.86.5.93.97a.98.98 0 0 1-.28.84l-1.61 1.61a2.4 2.4 0 0 1-3.4 0l-1.57-1.57a1.03 1.03 0 0 0-.88-.29c-.49.07-.84.5-1.02.97a2.5 2.5 0 1 1-3.24-3.24c.46-.18.9-.53.97-1.02a1.03 1.03 0 0 0-.29-.88L2.7 13.7a2.4 2.4 0 0 1 0-3.4l1.53-1.53c.24-.24.58-.35.92-.3.51.08.88.53 1.07 1.01a2.5 2.5 0 1 0 3.26-3.26c-.48-.2-.93-.56-1.01-1.07-.05-.34.06-.68.3-.92L10.3 2.7a2.4 2.4 0 0 1 3.4 0l1.57 1.57c.23.23.56.34.88.29.49-.07.84-.5 1.02-.97a2.5 2.5 0 1 1 3.24 3.24c-.46.18-.9.53-.97 1.02z"/></svg>
      <span class="label">Extensiones</span>
    </div>
    <div class="item" role="menuitem" tabindex="0" data-action="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span class="label">Ajustes</span>
    </div>
    <div class="item" role="menuitem" tabindex="0" data-action="about">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <span class="label">Acerca de Michi</span>
    </div>
    <div class="sep"></div>
    <div class="item quit" role="menuitem" tabindex="0" data-action="quit">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      <span class="label">Salir</span>
    </div>
  </div>

<script src="/wallpaper.js" data-variant="blur"></script>
<script>
(function () {
  function ipc(cmd, extra) {
    window.ipc.postMessage(JSON.stringify(Object.assign({ cmd }, extra || {})));
  }

  document.querySelectorAll('[data-action]').forEach(function (el) {
    el.addEventListener('click', function () { ipc('menu', { action: el.getAttribute('data-action') }); });
  });

  // Navegacion con teclado: flechas entre items, Enter/Espacio activa, Escape cierra.
  var items = Array.prototype.slice.call(document.querySelectorAll('.item'));
  document.addEventListener('keydown', function (e) {
    var i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') {
      ipc('close_menu');
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var step = e.key === 'ArrowDown' ? 1 : -1;
      var next = i;
      do { next = (next + step + items.length) % items.length; }
      while (items[next].getAttribute('aria-disabled') === 'true' && next !== i);
      items[next].focus();
    } else if ((e.key === 'Enter' || e.key === ' ') && i !== -1) {
      e.preventDefault();
      items[i].click();
    }
  });

  window.onMenuState = function (s) {
    document.getElementById('zoom').textContent = Math.round(s.zoom * 100) + '%';
    var bm = document.getElementById('bookmark');
    bm.setAttribute('aria-disabled', s.canBookmark ? 'false' : 'true');
    document.getElementById('bookmark-label').textContent =
      s.bookmarked ? 'Quitar de marcadores' : 'Agregar a marcadores';
  };

  ipc('ready');
})();
</script>
</body>
</html>
