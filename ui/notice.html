<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Aviso</title>
<style>
  /* Aviso de "pantalla completa" (ver src/notice.rs). Lo muestra la interfaz,
     no la pagina: un sitio no lo puede tapar ni imitar quitandolo. */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
    background: #12111f;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: #f3f4fb; user-select: none; cursor: default;
  }
  .box {
    height: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 0 18px; border: 1px solid rgba(255,255,255,0.18); border-radius: 12px;
    font-size: 13.5px; line-height: 1.3; text-align: center;
  }
  b { font-weight: 600; word-break: break-all; }
  kbd {
    font: inherit; font-size: 12px; padding: 1px 7px; border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08);
  }
</style>
</head>
<body>
<div class="box"><span id="text"></span></div>
<script>
(function () {
  var text = document.getElementById('text');
  // Rust -> aviso: el sitio que acaba de pasar a pantalla completa.
  window.onNotice = function (host) {
    text.textContent = '';
    var who = document.createElement('b');
    who.textContent = host || 'Esta página';
    var key = document.createElement('kbd');
    key.textContent = 'Esc';
    text.append(who, ' está en pantalla completa. Presiona ', key, ' para salir.');
  };
})();
</script>
</body>
</html>
